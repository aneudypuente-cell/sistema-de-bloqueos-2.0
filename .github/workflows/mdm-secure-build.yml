name: MDM Secure Build

on:
  workflow_dispatch:
  push:
    branches: [mdm-anti-suspension]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
      - name: Verify source
        run: test -s MDM.apk && sha256sum MDM.apk
      - name: Decode
        run: java -jar apktool.jar d MDM.apk -o work --force
      - name: Verify existing device-admin implementation
        run: |
          grep -Ril "DeviceAdminReceiver\|DevicePolicyManager" work/smali* work/AndroidManifest.xml work/res/xml 2>/dev/null | head -30
          test -f work/res/xml/device_admin_receiver.xml
      - name: Preserve and patch manifest permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("work/AndroidManifest.xml")
          s=p.read_text()
          for perm in ["android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS","android.permission.RECEIVE_BOOT_COMPLETED"]:
              if perm not in s:
                  s=s.replace("<uses-permission", f'<uses-permission android:name="{perm}" />\n    <uses-permission', 1)
          p.write_text(s)
          PY
      - name: Rebuild
        run: java -jar apktool.jar b work -o MDM-AnCar-Secure-unsigned.apk
      - name: Sign
        run: |
          mkdir -p signed
          java -jar signer.jar --apks MDM-AnCar-Secure-unsigned.apk --out signed
          APK=$(find signed -type f -name '*.apk' | head -1)
          test -s "$APK"
          sha256sum MDM.apk "$APK" > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MDM-AnCar-Secure
          path: |
            signed/*.apk
            SHA256.txt
