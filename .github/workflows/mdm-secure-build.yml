name: MDM Secure Build

on:
  workflow_dispatch:
  push:
    branches: [mdm-anti-suspension]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Verify source
        run: |
          test -s MDM.apk
          sha256sum MDM.apk

      - name: Read original APK metadata
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          aapt dump badging MDM.apk | tee badging.txt
          python3 - <<'PY'
          import re
          s=open("badging.txt",encoding="utf-8",errors="replace").read()
          m=re.search(r"versionCode='([0-9]+)'",s)
          if not m:
              raise SystemExit("Could not read versionCode from original APK")
          code=int(m.group(1))
          open("ORIGINAL_VERSION_CODE","w").write(str(code))
          print("original versionCode ->",code)
          PY

      - name: Decode
        run: java -jar apktool.jar d MDM.apk -o work --force

      - name: Verify MDM components
        run: |
          grep -Ril "DeviceAdminReceiver\|DevicePolicyManager\|FirebaseMessagingService" work/smali* work/AndroidManifest.xml 2>/dev/null | head -50
          test -f work/res/xml/device_admin_receiver.xml

      - name: Patch manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("work/AndroidManifest.xml")
          s=p.read_text(encoding="utf-8")
          original=int(Path("ORIGINAL_VERSION_CODE").read_text().strip())
          new_code=original+1

          # Add permissions only when absent.
          for perm in (
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ):
              if perm not in s:
                  s=s.replace(
                      "</manifest>",
                      f'    <uses-permission android:name="{perm}" />\n</manifest>',
                      1
                  )

          # Apktool may omit versionCode or emit it in a non-numeric/resource form.
          # Normalize it to the verified APK version + 1.
          manifest_match=re.search(r"<manifest\b[^>]*>",s,re.S)
          if not manifest_match:
              raise SystemExit("manifest element missing")

          opening=manifest_match.group(0)
          if re.search(r'android:versionCode="[^"]*"',opening):
              opening=re.sub(
                  r'android:versionCode="[^"]*"',
                  f'android:versionCode="{new_code}"',
                  opening,
                  count=1
              )
          else:
              opening=opening[:-1] + f' android:versionCode="{new_code}">'

          s=s[:manifest_match.start()]+opening+s[manifest_match.end():]
          p.write_text(s,encoding="utf-8")
          print("versionCode ->",new_code)
          PY

      - name: Rebuild
        run: java -jar apktool.jar b work -o MDM-AnCar-Secure-unsigned.apk

      - name: Sign and verify APK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          keytool -genkeypair -v             -keystore release.jks             -alias ancar             -keyalg RSA             -keysize 4096             -validity 10000             -storepass changeit             -keypass changeit             -dname "CN=AnCar Global Tech,O=AnCar,C=DO"

          apksigner sign             --ks release.jks             --ks-pass pass:changeit             --key-pass pass:changeit             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out MDM-AnCar-Secure.apk             MDM-AnCar-Secure-unsigned.apk

          apksigner verify --verbose --print-certs MDM-AnCar-Secure.apk
          zipalign -c -P 4 -v 4 MDM-AnCar-Secure.apk
          sha256sum MDM.apk MDM-AnCar-Secure.apk > SHA256.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MDM-AnCar-Secure-Release
          path: |
            MDM-AnCar-Secure.apk
            SHA256.txt
