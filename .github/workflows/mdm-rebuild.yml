name: MDM Anti-Suspension Build

on:
  push:
    branches: [mdm-anti-suspension]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Decode APK
        run: java -jar apktool.jar d MDM.apk -o work/apktool --force

      - name: Patch battery permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("work/apktool/AndroidManifest.xml")
          s=p.read_text()
          perms=[
            "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
            "android.permission.RECEIVE_BOOT_COMPLETED"
          ]
          marker="<uses-permission"
          for perm in perms:
            if perm not in s:
              s=s.replace(marker, f'<uses-permission android:name="{perm}" />\n    {marker}', 1)
          p.write_text(s)
          PY

      - name: Rebuild
        run: java -jar apktool.jar b work/apktool -o MDM-AntiSuspension-unsigned.apk

      - name: Sign
        run: java -jar uber-apk-signer.jar --apks MDM-AntiSuspension-unsigned.apk --out signed

      - name: Validate
        run: |
          test -s signed/MDM-AntiSuspension-unsigned-aligned-debugSigned.apk
          sha256sum MDM.apk signed/*.apk > SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDM-AntiSuspension
          path: |
            signed/*.apk
            SHA256.txt
